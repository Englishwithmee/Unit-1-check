const grammar=[
{q:'I have a new tablet. This is _____ tablet.',o:['my','his','her','their'],a:'my',why:'Use “my” to show something belongs to me (I).'},
{q:'She has a beautiful handbag. It is _____ handbag.',o:['his','our','her','your'],a:'her',why:'Use “her” for something that belongs to a girl or woman.'},
{q:'Tom always wears _____ watch.',o:['her','his','its','their'],a:'his',why:'Use “his” to show something belongs to Tom.'},
{q:'We have three umbrellas. They are _____ umbrellas.',o:['your','my','his','our'],a:'our',why:'Use “our” for things that belong to us.'},
{q:'The students bring _____ tablets to class.',o:['their','its','her','his'],a:'their',why:'Use “their” for something belonging to the students.'},
{q:'You have a nice wallet. Is this _____ wallet?',o:['my','our','your','her'],a:'your',why:'Use “your” when speaking to the owner.'},
{q:'The cat is playing with _____ toy.',o:['their','its','our','your'],a:'its',why:'Use “its” for a thing belonging to an animal when its sex is not specified.'},
{q:'These are _____ glasses. (Mary)',o:["Mary's",'Marys',"Marys'",'Mary'],a:"Mary's",why:'Add ’s to a singular name: Mary’s.'},
{q:'The _____ bags are on the table. (students)',o:["student's",'students',"students'",'student'],a:"students'",why:'Add an apostrophe after -s for a regular plural owner: students’.'},
{q:'The _____ toys are everywhere. (children)',o:["childrens'","children's",'childrens','children'],a:"children's",why:'Irregular plural “children” takes ’s: children’s.'},
{q:'This is _____ new car. (my father)',o:['my fathers',"my fathers'",'my father',"my father's"],a:"my father's",why:'For one father, add ’s: my father’s.'},
{q:'_____ classroom is on the second floor. (we)',o:['Our','Their','His','Your'],a:'Our',why:'“We” changes to the possessive adjective “our”.'},
{q:'The _____ shoes are outside. (boys)',o:["boy's",'boys',"boys'",'boy'],a:"boys'",why:'For more than one boy, write boys’.'},
{q:'The _____ handbags are pink. (women)',o:['womens',"women's","womens'",'woman'],a:"women's",why:'Irregular plural “women” takes ’s: women’s.'},

const app=document.getElementById('app'),teacher=document.getElementById('teacher');let state;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(txt,act,cls='btn')=>`<button class="${cls}" data-act="${act}">${txt}</button>`;
function home(){state=null;app.innerHTML=`<section class="hero"><div class="eyebrow">Interactive oral assessment</div><h1>Ready to test your<br>English skills?</h1><p class="muted">20 questions · 10 Grammar + 10 Picture Hangman<br>One thoughtful challenge at a time.</p><div class="modes"><div class="mode"><div class="icon">✍️</div><h3>Grammar Quiz</h3><p class="muted">10 multiple-choice questions about possessives.</p><span class="tag">10 points</span></div><div class="mode"><div class="icon">🔎</div><h3>Picture Hangman</h3><p class="muted">Guess 10 everyday objects using pictures and definitions.</p><span class="tag green">10 points</span></div></div>${btn('Start 20-Question Check-up →','start')}<p class="muted tiny">Images adapted from your uploaded classroom vocabulary sheet.</p></section>`}
function start(){state={part:0,idx:0,gs:shuffle(grammar).slice(0,10).map(x=>({...x,opts:shuffle(x.o)})),vs:shuffle(vocab).slice(0,10),scores:[0,0],chosen:null,submitted:false,guessed:[],mistakes:0,hint:false,teacherReveal:false};render()}
function active(){return state.part===0?state.gs[state.idx]:state.vs[state.idx]}
function render(){if(!state){home();return}if(state.part===2){results();return}const n=state.idx+1+state.part*10,which=state.part===0?'GRAMMAR QUIZ':'PICTURE HANGMAN';app.innerHTML=`<div class="toolbar"><div class="meta"><span class="tag ${state.part?'green':''}">${which}</span><span class="muted tiny">Question ${n} / 20</span></div><div class="meta"><span class="pill">Score: ${state.scores[0]+state.scores[1]} / 20</span>${btn('⌂ Home','home','btn white')}${btn('⛶ Fullscreen','full','btn white')}</div></div><div class="progress"><div class="fill" style="width:${((n-1)/20)*100}%"></div></div><div id="teacherTools"></div><section class="panel" id="question"></section>`;if(state.part===0)renderGrammar();else renderWord();teacherTools()}
function teacherTools(){const t=document.getElementById('teacherTools');if(!t)return;t.innerHTML=teacher.checked?`<div class="teacher"><b>🎓 Teacher Mode</b> · Ask students to answer aloud before revealing. <div class="actions">${btn('Random remaining question','random','btn pale')}${btn('Reveal answer','reveal','btn pale')}${btn('Next question','next','btn white')}</div></div>`:''}
function renderGrammar(){let q=active(),locked=state.submitted||state.teacherReveal;document.getElementById('question').innerHTML=`<span class="eyebrow">Choose the correct answer</span><div class="qtitle">${esc(q.q)}</div><div class="options">${q.opts.map((o,i)=>`<button class="option ${state.chosen===o?'selected':''} ${locked&&o===q.a?'correct':''} ${locked&&state.chosen===o&&o!==q.a?'wrong':''}" data-act="choose" data-v="${i}" ${locked?'disabled':''}><strong>${'ABCD'[i]}.</strong>${esc(o)}</button>`).join('')}</div>${locked?`<div class="feedback ${state.teacherReveal?'':state.chosen===q.a?'good':'bad'}"><b>${state.teacherReveal?'Answer revealed':state.chosen===q.a?'Excellent! That’s correct.':'Good try!'}</b><br>Correct answer: <b>${esc(q.a)}</b><br>${esc(q.why)}</div>`:''}<div class="actions">${btn('🔊 Read question','speak','btn white')}${!locked?btn('Check Answer','submit', 'btn'):btn(state.idx===9?(state.part===0?'Continue to Vocabulary →':'View Results'):'Next Question →','next')}</div>`}
function renderWord(){let [word,definition,img]=active(),done=state.submitted||state.teacherReveal,guesses=state.guessed;document.getElementById('question').innerHTML=`<span class="eyebrow">Look · Read · Guess</span><img class="visual" src="${IMAGE_DATA[img]}" alt="Vocabulary object"><p class="definition">“${esc(definition)}”</p><div class="hangmeta">${done?(state.teacherReveal?'Answer revealed':state.mistakes>=6?'No attempts remaining':'Word complete!'):`${6-state.mistakes} incorrect guesses remaining`}</div><div class="letters">${[...word.toUpperCase()].map(c=>c===' '?'<div class="letter space"></div>':`<div class="letter">${done||guesses.includes(c)?esc(c):'&nbsp;'}</div>`).join('')}</div><div class="keyboard">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>`<button class="key" data-act="letter" data-v="${c}" ${done||guesses.includes(c)?'disabled':''}>${c}</button>`).join('')}</div>${done?`<div class="feedback ${state.teacherReveal?'':state.mistakes<6?'good':'bad'}"><b>${state.mistakes>=6&&!state.teacherReveal?'Good try!':'The word is:'} ${esc(word.toUpperCase())}</b><br>${esc(definition)}</div>`:''}<div class="actions">${!done?btn(state.hint?'Hint used':'Hint: first letter','hint','btn pale'):btn('🔊 Pronounce word','sayword','btn white')}${done?btn(state.idx===9?'View Results →':'Next Word →','next'):''}</div>`}
function next(){if(!state)return;if(!state.submitted&&!state.teacherReveal){if(!teacher.checked)return;state.teacherReveal=true}if(state.idx===9){state.idx=0;state.part++}else state.idx++;state.chosen=null;state.submitted=false;state.guessed=[];state.mistakes=0;state.hint=false;state.teacherReveal=false;render()}
function random(){if(!teacher.checked||!state||state.submitted||state.teacherReveal)return;let pool=state.part===0?state.gs:state.vs;let i=state.idx+Math.floor(Math.random()*(10-state.idx));[pool[state.idx],pool[i]]=[pool[i],pool[state.idx]];render()}
function reveal(){if(!state||state.submitted||state.teacherReveal)return;state.teacherReveal=true;if(state.part===0)renderGrammar();else renderWord();teacherTools()}
function letter(c){if(state.submitted||state.teacherReveal||state.guessed.includes(c))return;const w=active()[0].toUpperCase();state.guessed.push(c);if(!w.includes(c))state.mistakes++;if([...w].filter(x=>x!==' ').every(x=>state.guessed.includes(x))){state.submitted=true;state.scores[1]++}else if(state.mistakes>=6)state.submitted=true;renderWord()}
function hint(){if(state.hint||state.submitted||state.teacherReveal)return;state.hint=true;letter(active()[0][0].toUpperCase())}
function speak(t){if(!('speechSynthesis'in window))return alert('Text-to-speech is unavailable in this browser.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function results(){let total=state.scores[0]+state.scores[1],pct=total*5,msg=pct>=90?'Outstanding performance!':pct>=75?'Great work!':pct>=60?'Good progress. Keep practicing!':'Keep practicing. You’ll improve!';app.innerHTML=`<section class="panel summary"><div class="eyebrow">Assessment complete</div><h1>Well done! ✨</h1><div class="score">${total}<span style="font-size:24px;color:#9391a0;letter-spacing:0"> / 20</span></div><h2>${msg}</h2><p class="muted">Your converted score is <b>${(total/2).toFixed(1)} / 10</b>.</p><div class="statrow"><div class="stat"><strong>${state.scores[0]}/10</strong><span>Grammar</span></div><div class="stat"><strong>${state.scores[1]}/10</strong><span>Vocabulary</span></div><div class="stat"><strong>${pct}%</strong><span>Overall</span></div></div><div class="actions" style="justify-content:center">${btn('Try a New Test','start')}${btn('Back to Home','home','btn white')}</div></section>`}
app.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;if(a==='start')start();if(a==='home')home();if(a==='full'){document.body.classList.toggle('full');if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.().catch(()=>{})}if(!state)return;if(a==='choose'&&!state.submitted&&!state.teacherReveal){state.chosen=active().opts[+v];renderGrammar()}if(a==='submit'&&state.chosen!==null&&!state.submitted&&!state.teacherReveal){state.submitted=true;if(state.chosen===active().a)state.scores[0]++;renderGrammar()}if(a==='next')next();if(a==='random')random();if(a==='reveal')reveal();if(a==='letter')letter(v);if(a==='hint')hint();if(a==='speak')speak(active().q.replace('_____','blank'));if(a==='sayword')speak(active()[0])});teacher.addEventListener('change',()=>{if(state)render()});home();
</script></body></html>
